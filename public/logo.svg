<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="80" fill="url(#logoGradient)"/>
  <!-- Wallet icon - larger and centered -->
  <g transform="translate(128, 160)">
    <!-- Wallet body -->
    <rect x="32" y="64" width="320" height="192" rx="24" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wallet opening line -->
    <path d="M32 128h320" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/>
    <!-- Wallet card/clasp -->
    <rect x="256" y="96" width="64" height="64" rx="8" fill="white"/>
  </g>
</svg>
